<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyprus Bureaucracy & Citizen Agent</title>
<style>
  :root {
    --bg: #eae6df; --panel: #ffffff; --header: #075e54; --accent: #128c7e;
    --bubble-bot: #ffffff; --bubble-user: #d9fdd3; --text: #111b21; --muted: #667781;
    --btn: #f0f2f5; --btn-border: #d1d7db; --link: #027eb5; --banner: #fff4d6; --banner-b: #e6d38a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b141a; --panel: #111b21; --header: #1f2c33; --accent: #00a884;
      --bubble-bot: #202c33; --bubble-user: #005c4b; --text: #e9edef; --muted: #8696a0;
      --btn: #202c33; --btn-border: #2a3942; --link: #53bdeb; --banner: #2a2410; --banner-b: #4d431a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 620px; height: 100dvh; display: flex; flex-direction: column;
         background: var(--panel); box-shadow: 0 0 24px rgba(0,0,0,.12); }
  header { background: var(--header); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
                   display: grid; place-items: center; font-size: 20px; flex: 0 0 auto; }
  header .title { font-weight: 600; font-size: 16px; line-height: 1.2; }
  header .sub { font-size: 12px; opacity: .8; }
  .banner { background: var(--banner); border-bottom: 1px solid var(--banner-b); color: var(--text);
            font-size: 12px; padding: 8px 14px; display: flex; gap: 8px; align-items: flex-start; }
  .banner button { margin-left: auto; background: none; border: none; color: var(--muted);
                   font-size: 16px; cursor: pointer; line-height: 1; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 8px 11px; border-radius: 10px; font-size: 14.5px; line-height: 1.45;
            white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .bot .bubble { background: var(--bubble-bot); border-top-left-radius: 2px; }
  .user .bubble { background: var(--bubble-user); border-top-right-radius: 2px; }
  .bubble a { color: var(--link); }
  .options { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 4px; }
  .options button { background: var(--btn); border: 1px solid var(--btn-border); color: var(--accent);
                    border-radius: 16px; padding: 7px 13px; font-size: 13.5px; cursor: pointer; font-weight: 500; }
  .options button:hover { filter: brightness(.97); }
  .doc { display: flex; align-items: center; gap: 10px; background: var(--bubble-bot); border: 1px solid var(--btn-border);
         border-radius: 10px; padding: 10px 12px; max-width: 82%; text-decoration: none; color: var(--text); }
  .doc .ic { font-size: 22px; } .doc .meta { font-size: 13px; } .doc .meta small { color: var(--muted); }
  .typing .bubble { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--btn-border); background: var(--panel); }
  #input { flex: 1; border: 1px solid var(--btn-border); background: var(--panel); color: var(--text);
           border-radius: 20px; padding: 10px 14px; font-size: 15px; outline: none; }
  #send { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px;
          font-size: 18px; cursor: pointer; flex: 0 0 auto; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🇨🇾</div>
    <div>
      <div class="title">Cyprus Citizen Agent</div>
      <div class="sub">Residency · Tax · GeSy · VAT · Companies</div>
    </div>
  </header>
  <div class="banner" id="banner">
    <span>⚠️ AI assistant — not legal or tax advice, and not affiliated with the Republic of Cyprus. Always confirm with official Gov.cy sources.</span>
    <button onclick="document.getElementById('banner').style.display='none'" aria-label="dismiss">✕</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="Type a message… (English or Ελληνικά)" autocomplete="off">
    <button id="send" type="submit" aria-label="send">➤</button>
  </form>
</div>

<script>
(function () {
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  // Stable per-browser user id.
  let uid;
  try {
    uid = localStorage.getItem('cy_uid');
    if (!uid) { uid = 'web-' + Math.random().toString(36).slice(2, 12); localStorage.setItem('cy_uid', uid); }
  } catch (e) { uid = 'web-' + Math.random().toString(36).slice(2, 12); }

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function fmt(s) {
    // Escape, then apply WhatsApp-style *bold* and _italic_, linkify URLs, keep newlines.
    let h = esc(s);
    h = h.replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/_([^_\n]+)_/g, '<i>$1</i>');
    h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return h;
  }
  function scroll() { log.scrollTop = log.scrollHeight; }

  function addBubble(text, who) {
    const row = document.createElement('div'); row.className = 'row ' + who;
    const b = document.createElement('div'); b.className = 'bubble'; b.innerHTML = fmt(text);
    row.appendChild(b); log.appendChild(row); scroll(); return row;
  }
  function addOptions(options) {
    const row = document.createElement('div'); row.className = 'row bot';
    const wrap = document.createElement('div'); wrap.className = 'options';
    options.forEach(o => {
      const btn = document.createElement('button'); btn.textContent = o.title;
      btn.onclick = () => { wrap.querySelectorAll('button').forEach(x => x.disabled = true); sendMessage(o.id, o.title); };
      wrap.appendChild(btn);
    });
    row.appendChild(wrap); log.appendChild(row); scroll();
  }
  function addDoc(reply) {
    const row = document.createElement('div'); row.className = 'row bot';
    const a = document.createElement('a'); a.className = 'doc'; a.href = reply.file_url || '#';
    a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = '<span class="ic">📄</span><span class="meta">' + esc(reply.caption || reply.filename) +
                  '<br><small>' + esc(reply.filename) + ' — tap to open</small></span>';
    row.appendChild(a); log.appendChild(row); scroll();
  }

  let typingEl = null;
  function typing(on) {
    if (on) {
      typingEl = document.createElement('div'); typingEl.className = 'row bot typing';
      typingEl.innerHTML = '<div class="bubble">typing…</div>'; log.appendChild(typingEl); scroll();
    } else if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  async function sendMessage(text, displayText, silent) {
    if (!silent) addBubble(displayText || text, 'user');
    input.value = ''; send.disabled = true; typing(true);
    try {
      const res = await fetch('/web/message', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ user_id: uid, text: text })
      });
      const data = await res.json();
      typing(false);
      (data.replies || []).forEach(r => {
        if (r.kind === 'document') { addDoc(r); return; }
        if (r.text) addBubble(r.text, 'bot');
        if (r.options && r.options.length) addOptions(r.options);
      });
    } catch (e) {
      typing(false); addBubble('⚠️ Network error — please try again.', 'bot');
    } finally { send.disabled = false; input.focus(); }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (text) sendMessage(text);
  });

  // Kick off with the welcome menu (no user bubble for this automatic call).
  sendMessage('menu', null, true);
})();
</script>
</body>
</html>
