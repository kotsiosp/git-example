<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayBet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" data-nav="matches"><span class="brand-ball">⚽</span> <span id="site-name">PlayBet</span></a>
    <nav id="nav" class="nav hidden"></nav>
    <div id="account" class="account hidden">
      <span class="balance" id="balance"></span>
      <button class="btn ghost small" id="logout">Log out</button>
    </div>
  </header>

  <div id="demo-banner" class="banner hidden">Demo odds — the site owner hasn't connected a live odds feed yet.</div>

  <main id="view"></main>

  <aside id="slip" class="slip hidden" aria-label="Bet slip"></aside>
  <aside id="parlay" class="slip hidden" aria-label="Parlay slip"></aside>

  <div id="toast" class="toast hidden" role="status"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modal-card"></div></div>

  <footer class="footer">Play money only — no real money is wagered, deposited or paid out.</footer>

  <script src="/app.js"></script>
</body>
</html>
